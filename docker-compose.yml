services:
  db:
    image: postgres:16-alpine
    container_name: job-queue-db
    environment:
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue
      POSTGRES_DB: jobqueue
    ports:
      - "5434:5432"
    volumes:
      - job-queue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job-queue-pgdata: